name: verify

on: [push, pull_request, workflow_dispatch]   # dispatch: task 076 flake-rate runs

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The only lanes since 2026-10-08: the owner made playbook Linux-only until it
  # is stable. The last version CI tested on macOS and Windows/Git Bash is 1.5.47
  # (tag `last-multiplatform`, branch `multiplatform`); its workflow had those
  # two jobs — `git show last-multiplatform:.github/workflows/verify.yml`.
  linux:
    name: linux / py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # scripts/verify enumerates via `git ls-files`
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The sandbox is the product's containment and Linux is its only platform:
      # with bubblewrap on the runner the live sandbox tests run here instead of
      # skipping (task 158). bwrap needs unprivileged user namespaces, which the
      # Ubuntu 24.04 image restricts through AppArmor — lifted for this job only.
      # The probe fails the step, loudly, if bwrap still cannot start.
      - name: install bubblewrap (apt)
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid true
          echo "bwrap usable on this runner"

      - name: scripts/verify
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/verify | tee verify-linux-py${{ matrix.python }}.txt

      - name: install zsh (apt)
        if: always()
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh
          zsh --version

      # Run the real bash-log.zsh against the four lane shapes and assert the
      # files it actually writes. Moved here from the macOS job when CI became
      # Linux-only (owner decision 2026-10-08); the runner has no zsh, so the
      # step before installs it.
      - name: bash-log.zsh lane shapes (real zsh)
        if: always()
        shell: bash
        run: |
          set -u
          # A dogfooding host propagates the plugin's own bash-log via BASH_ENV,
          # which writes .agent/bash_history into every scratch project and would
          # forge these assertions (see tests/test_shell_fixtures.py).
          unset BASH_ENV
          LOGGER="$PWD/plugins/playbook/scripts/bash-log.zsh"
          ZDOT="$(mktemp -d)"; WORK="$(mktemp -d)"; RC=0
          printf 'source %s\n' "$LOGGER" > "$ZDOT/.zshenv"
          PROBE="playbook-zsh-probe"

          # $1 scenario name, $2 expected history file relative to .agent/ ("" = nothing written)
          lane() {
            name="$1"; want="$2"; proj="$WORK/$name"
            ( cd "$proj" && ZDOTDIR="$ZDOT" HOME="$ZDOT" zsh -c "echo $PROBE" >/dev/null 2>&1 ) || true
            got="$(cd "$proj" && find .agent -name bash_history -type f | sort | tr '\n' ' ')"
            got="${got% }"
            if [ "$got" = "$want" ]; then
              echo "  PASS  $name → [${want:-nothing}]"
            else
              echo "  FAIL  $name → expected [${want:-nothing}], got [${got:-nothing}]"; RC=1
            fi
          }

          # 1. valid marker → that user's lane, never the root
          mkdir -p "$WORK/valid-marker/.agent/alice"
          echo alice > "$WORK/valid-marker/.agent/current_user"
          lane valid-marker ".agent/alice/bash_history"

          # 2. no marker + root .agent/tasks/ → root lane
          mkdir -p "$WORK/no-marker-root-tasks/.agent/tasks"
          lane no-marker-root-tasks ".agent/bash_history"

          # 3. no marker + no root tasks/ → the owning lane is unknown: write nothing
          mkdir -p "$WORK/no-marker-no-tasks/.agent"
          lane no-marker-no-tasks ""

          # 4. unusable marker → write nothing (root fallback = cross-user leak)
          mkdir -p "$WORK/invalid-marker/.agent/alice"
          printf '../evil\n' > "$WORK/invalid-marker/.agent/current_user"
          lane invalid-marker ""

          echo "bash-log.zsh lane shapes: rc=$RC" | tee -a verify-linux-py${{ matrix.python }}.txt
          exit $RC

      - name: Step summary
        if: always()
        shell: bash
        run: |
          { echo '```'; cat verify-linux-py${{ matrix.python }}.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-linux-py${{ matrix.python }}
          path: verify-linux-py${{ matrix.python }}.txt
