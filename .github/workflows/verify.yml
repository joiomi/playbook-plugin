name: verify

on: [push, pull_request, workflow_dispatch]   # dispatch: task 076 flake-rate runs

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The only lanes since 2026-10-08: the owner made playbook Linux-only until it
  # is stable. The last version CI tested on macOS and Windows/Git Bash is 1.5.47
  # (tag `last-multiplatform`, branch `multiplatform`); its workflow had those
  # two jobs — `git show last-multiplatform:.github/workflows/verify.yml`.
  linux:
    name: linux / py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # scripts/verify enumerates via `git ls-files`
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The sandbox is the product's containment and Linux is its only platform:
      # with bubblewrap on the runner the live sandbox tests run here instead of
      # skipping (task 158). bwrap needs unprivileged user namespaces, which the
      # Ubuntu 24.04 image restricts through AppArmor — lifted for this job only.
      # The probe fails the step, loudly, if bwrap still cannot start.
      - name: install bubblewrap (apt)
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid true
          echo "bwrap usable on this runner"

      - name: scripts/verify
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/verify | tee verify-linux-py${{ matrix.python }}.txt

      - name: Step summary
        if: always()
        shell: bash
        run: |
          { echo '```'; cat verify-linux-py${{ matrix.python }}.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-linux-py${{ matrix.python }}
          path: verify-linux-py${{ matrix.python }}.txt
